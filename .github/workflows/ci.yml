name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myday
          POSTGRES_PASSWORD: myday
          POSTGRES_DB: myday_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U myday -d myday_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://myday:myday@localhost:5433/myday_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-please-32-characters-min
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies (non-blocking)
        run: npm audit --audit-level=critical || true
